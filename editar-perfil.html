<!DOCTYPE html> 
<html lang="pt-BR" data-exige-login="sim"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Editar Perfil - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">          
    
    <!-- ESTILOS EXCLUSIVOS DA TELA DE EDIÇÃO -->
    <style>         
        .edit-panel { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            background-color: var(--bg-main); 
            overflow-y: auto; 
            position: relative;
        }         
        
        .edit-header { 
            width: 100%; 
            height: 70px; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 1px solid var(--border-color); 
            position: sticky; 
            top: 0; 
            background: var(--bg-main);
            z-index: 10;
            padding-top: env(safe-area-inset-top);
        }         
        
        .btn-back { 
            background: none; 
            border: none; 
            color: var(--text-main); 
            font-size: 24px; 
            cursor: pointer; 
            transition: 0.2s; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin-right: 15px;
        }         
        .btn-back:active { transform: scale(0.9); }         
        
        .edit-container { 
            width: 100%; 
            max-width: 500px; 
            padding: 40px 25px; 
            margin: 0 auto; 
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }         
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sec);
            margin-bottom: 8px;
            margin-left: 4px;
        }
        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 15px 18px;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        textarea.input-field {
            resize: vertical;
            min-height: 100px;
        }
        .input-field:focus {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(230,0,43,0.1);
        }
        .input-field::placeholder {
            color: var(--border-color);
        }

        .btn-save { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 10px; 
            border: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: var(--primary-accent); 
            color: white; 
            box-shadow: var(--primary-glow); 
        }         
        .btn-save:hover { 
            background: var(--primary-accent-2); 
            transform: translateY(-2px); 
        }         
        .btn-save:active { transform: scale(0.97); }
        .btn-save:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .helper-text {
            font-size: 12px;
            color: var(--text-sec);
            margin-top: 6px;
            margin-left: 4px;
            display: block;
        }

        #toast-aviso { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary-accent); color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 4px 15px rgba(230,0,43,0.4); white-space: nowrap; }         
        #toast-aviso.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }         

        /* Otimização Desktop */
        @media (min-width: 850px) {             
            .edit-panel { border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); max-width: 650px; margin: 0 auto; }         
        }
    </style> 
</head> 
<body>     
    <div class="app-layout">                  
        
        <!-- NAVEGAÇÃO LATERAL -->
        <nav class="side-nav">             
            <a href="inbox.html" class="nav-item" title="Página Inicial">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455Z"></path></svg>
            </a>             
            <a href="explorar.html" class="nav-item" title="Pesquisa">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg>
            </a>             
            <a href="inbox.html" class="nav-item" title="Mensagens">                 
                <div id="badgeGlobal" class="badge" style="display: none;">0</div>                 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>             
            </a>             
            <!-- Botão ATIVO agora é o Meu Perfil -->
            <a href="index.html" class="nav-item active" title="Perfil">
                <img id="navAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">
            </a>                          
            <a href="configuracoes.html" class="nav-item" title="Mais" style="margin-top: auto; margin-bottom: 20px; cursor: pointer;">                 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="21" y2="4"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="20" x2="21" y2="20"></line></svg>             
            </a>         
        </nav>         
        
        <main class="edit-panel">             
            <header class="edit-header">                 
                <button class="btn-back" type="button" data-acao="voltar" aria-label="Voltar">                     
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>                 
                </button>                 
                <strong style="font-size: 18px; color: var(--text-main);">Editar Perfil</strong>             
            </header>             
            
            <div class="edit-container">                 
                
                <div class="input-group">
                    <label for="inputNome">Nome de Exibição</label>
                    <input type="text" id="inputNome" class="input-field" placeholder="Seu nome" autocomplete="name">
                    <span class="helper-text">Ajude as pessoas a descobrirem sua conta usando o nome pelo qual você é conhecido.</span>
                </div>

                <div class="input-group">
                    <label for="inputBio">Biografia</label>
                    <textarea id="inputBio" class="input-field" placeholder="Escreva algo sobre você..."></textarea>
                    <span class="helper-text">Conte um pouco sobre você, seus interesses ou profissão.</span>
                </div>

                <!-- Botão de alterar a foto adicionado aqui para facilitar a jornada do usuário -->
                <div class="input-group" style="margin-top: 30px; margin-bottom: 30px;">
                    <a href="foto.html" style="color: var(--primary-accent); text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        Mudar foto de perfil
                    </a>
                </div>

                <button id="btnSalvar" class="btn-save" type="button">Salvar Alterações</button>             
            </div>         
        </main>     
    </div>     
    
    <div id="toast-aviso">Alerta!</div>     

<!-- Script de Tempo Real -->
    <script type="module" src="radar.js"></script>
    <script type="module" src="editar-perfil.js"></script>
