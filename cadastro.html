<!DOCTYPE html> 
<html lang="pt-BR" data-so-deslogado="sim"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Cadastro - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">         
    
    <!-- ESTILOS EXCLUSIVOS DO CADASTRO (Aproveitando a estrutura limpa) -->
    <link rel="stylesheet" href="cadastro.css">
 
</head> 
<body>     
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-logo">Sinex<span>Chat</span></div>
            <div class="auth-subtitle">CRIE SUA CONTA GRÁTIS</div>

            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <!-- Atributo padrão WCAG para autopreenchimento de nome -->
                <input type="text" id="nome" class="input-field" placeholder="Seu nome" autocomplete="name">
            </div>

            <div class="input-group">
                <label for="usuario">Nome de Usuário</label>
                <!-- Atributo padrão WCAG para nome de usuário[cite: 6] -->
                <input type="text" id="usuario" class="input-field" placeholder="Ex: seunome123" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="input-field" placeholder="seu@email.com" autocomplete="email">
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <!-- Atributo padrão WCAG para indicar que é uma senha nova[cite: 6] -->
                <input type="password" id="senha" class="input-field" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <button id="btnCadastrar" class="btn-login" type="button">Criar Conta</button>

            <div class="auth-links">
                Já tem uma conta? <a href="login.html">Faça Login</a>
            </div>
        </div>
    </div>

    <div id="toast-aviso">Alerta!</div>     

    <script type="module" src="cadastro.js"></script>
</body> 
</html>
