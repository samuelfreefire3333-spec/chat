<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sinexflix</title>
<meta name="description" content="Descubra filmes e séries, saiba onde assistir, veja clássicos completos e TV aberta ao vivo.">
<meta name="theme-color" content="#0e0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sinexflix">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://api.piped.private.coffee" crossorigin>
<link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
<link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin>
<link rel="preconnect" href="https://images.metahub.space">
<link rel="dns-prefetch" href="https://api.themoviedb.org">
<link rel="dns-prefetch" href="https://archive.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="app.css?v=15">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button class="brand" id="brandBtn" aria-label="Início">
      <svg viewBox="0 0 64 64" class="brand-mark" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4060"/><stop offset="1" stop-color="#ffb030"/></linearGradient></defs><path d="M46 14a18 13 0 1 0-14 23a14 12 0 1 1-16 15" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="butt"/><path d="M28 39l10 5-10 5z" fill="#fff"/></svg>
      <span class="wordmark">SINEX<b>FLIX</b></span>
      <span class="kids-badge" id="kidsBadge" hidden>Kids</span>
    </button>
    <nav class="topbar-nav" id="topNav" aria-label="Menu principal">
      <button data-tab="inicio" class="active"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Início</span></button>
      <button data-tab="buscar"><svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg><span>Buscar</span></button>
      <button data-tab="aovivo"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM8 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="2.5"/></svg><span>TV ao vivo</span></button>
      <button data-tab="lista"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Minha Lista</span></button>
    </nav>
    <div class="topbar-right">
      <span class="version-pill">v3.1</span>
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6Z"/></svg>
      </button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="view-inicio" data-view="inicio"></section>
    <section class="view" id="view-buscar" data-view="buscar" hidden></section>
    <section class="view" id="view-aovivo" data-view="aovivo" hidden></section>
    <section class="view" id="view-lista" data-view="lista" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação">
    <button data-tab="inicio" class="active"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg><span>Início</span></button>
    <button data-tab="buscar"><svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.4 4.4-1.4 1.4-4.4-4.4A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg><span>Buscar</span></button>
    <button data-tab="aovivo"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM8 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="2.5"/></svg><span>Ao vivo</span></button>
    <button data-tab="lista"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Minha Lista</span></button>
  </nav>
</div>

<div id="overlays"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<script src="app.js?v=15" defer></script>
</body>
</html>
