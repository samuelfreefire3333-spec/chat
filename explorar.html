<!DOCTYPE html>
<html lang="pt-BR" data-exige-login="sim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="style.css">
    <script src="tema.js"></script>
    <title>Pesquisar - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="explorar.css">
</head>
<body>
    <div class="app-layout">

        <!-- NAVEGAÇÃO LATERAL -->
        <nav class="side-nav" aria-label="Navegação principal">
            <a href="inbox.html" class="nav-item nav-logo" title="Sinex Chat" aria-label="Sinex Chat: início"><span class="nav-logo-letra" aria-hidden="true">S</span></a>
            <a href="inbox.html" class="nav-item" title="Mensagens" aria-label="Mensagens">
                <span id="badgeGlobal" class="badge u-hidden" aria-hidden="true">0</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>
            </a>
            <a href="explorar.html" class="nav-item active" title="Pesquisar" aria-label="Pesquisar" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg></a>
            <a href="perfil.html" class="nav-item" title="Perfil" aria-label="Seu perfil"><img id="navAvatar" class="nav-avatar-icon" src="assets/avatar-padrao.svg" alt=""></a>
            <a href="configuracoes.html" class="nav-item nav-item-final" title="Mais" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="5" x2="21" y2="5"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="19" x2="21" y2="19"></line></svg></a>
        </nav>

        <!-- PAINEL DE EXPLORAR -->
        <main class="explore-panel">
            <header class="explore-header">
                <h1>Pesquisar</h1>
                <div class="search-box explore-busca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="inputBusca" placeholder="Pesquisar por nome ou usuário" aria-label="Pesquisar pessoas por nome ou usuário" aria-controls="listaResultados" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
                </div>
            </header>

            <div id="listaResultados" class="results-list" aria-live="polite">
                <div class="explorar-vazio">
                    Digite para procurar novos contatos.
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="radar.js"></script>
    <script type="module" src="explorar.js"></script>
</body>
</html>
