<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Pesquisar - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">         
    
    <!-- ESTILOS EXCLUSIVOS DA TELA EXPLORAR -->
    <style>         
        .explore-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
            overflow: hidden;
        }

        .explore-header {
            padding: 20px 25px 15px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            padding-top: calc(20px + env(safe-area-inset-top));
            background: var(--bg-main);
            z-index: 5;
        }

        .explore-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-panel-2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            transition: 0.2s ease;
        }

        .light-theme .search-box {
            background: var(--input-bg);
        }

        .search-box:focus-within {
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px rgba(230,0,43,0.1);
        }

        .search-box svg {
            color: var(--text-sec);
            min-width: 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            margin-left: 10px;
            width: 100%;
        }

        .search-box input::placeholder {
            color: var(--text-sec);
        }
        
        .results-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            -webkit-overflow-scrolling: touch;
        }
        
        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: 0.2s ease;
            margin-bottom: 4px;
        }
        
        .user-item:hover { 
            background: var(--bg-hover); 
            transform: translateX(2px); 
        }
        
        .user-avatar { 
            width: 52px; 
            height: 52px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1px solid var(--border-color); 
            flex-shrink: 0;
        }
        
        .user-info { 
            margin-left: 14px; 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        
        .user-name { 
            font-weight: 700; 
            font-size: 15px; 
            color: var(--text-main); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .user-username { 
            font-size: 13px; 
            color: var(--text-sec); 
            margin-top: 2px; 
        }
        
        /* Otimização para Desktop */
        @media (min-width: 850px) {             
            .explore-panel { max-width: 650px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); margin: 0 auto; }         
        }
    </style> 
</head> 
<body>     
    <div class="app-layout">                  
        
        <!-- NAVEGAÇÃO LATERAL -->
        <nav class="side-nav">             
            <a href="inbox.html" class="nav-item" title="Página Inicial">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455Z"></path></svg>
            </a>

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg>
            </a>             
            <a href="inbox.html" class="nav-item" title="Mensagens">                 
                <div id="badgeGlobal" class="badge" style="display: none;">0</div>                 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>             
            </a>             
            <a href="perfil.html" class="nav-item" title="Perfil">
                <img id="navAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            </a>                          
            <a href="configuracoes.html" class="nav-item" title="Mais" style="margin-top: auto; margin-bottom: 20px; cursor: pointer;">                 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="21" y2="4"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="20" x2="21" y2="20"></line></svg>             
            </a>         
        </nav>         
        
        <!-- PAINEL DE EXPLORAR -->
        <main class="explore-panel">
            <header class="explore-header">
                <h1>Pesquisar</h1>
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <!-- O evento oninput chama a função automaticamente sempre que você digita ou apaga -->
                    <input type="text" id="inputBusca" placeholder="Pesquisar por nome ou usuário..." autocomplete="off" autocorrect="off" autocapitalize="none">
                </div>
            </header>

            <div id="listaResultados" class="results-list">
                <div style="text-align: center; color: var(--text-sec); margin-top: 60px; font-size: 14px;">
                    Digite para procurar novos contatos.
                </div>
            </div>
        </main>     
    </div>     

<!-- Scripts de Tempo Real -->
