<!DOCTYPE html>
<html lang="pt-BR" data-exige-login="sim" data-sem-recarga-automatica="sim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0e">

    <link rel="stylesheet" href="style.css">
    <script src="tema.js"></script>
    <title>Chamada - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">

    <!-- Estilos exclusivos da tela de chamada -->
    <link rel="stylesheet" href="chamada.css">
</head>
<body class="pagina-chamada">
    <!-- data-estado: preparando | chamando | tocando | conectando | conectada | reconectando | encerrada -->
    <div class="call-wrapper" id="callWrapper" data-estado="preparando" data-tipo="video">

        <!-- Fundo: a foto do contato, borrada, enquanto não há vídeo -->
        <div class="chamada-fundo" id="chamadaFundo" aria-hidden="true"></div>

        <!-- CAMADA DE VÍDEO -->
        <div id="videoLayer" class="video-layer">
            <!-- Mudo de propósito: o som vem do <audio> abaixo. Assim fechar o
                 Picture-in-Picture (que pausa o vídeo) nunca corta a voz. -->
            <video id="videoRemoto" autoplay playsinline muted></video>
            <div id="localVideoContainer" class="local-video-container" data-canto="sd" aria-label="Sua câmera">
                <video id="videoLocal" autoplay playsinline muted></video>
                <div class="local-camera-off" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </div>
            </div>
        </div>
        <!-- CAMADA DA INTERFACE -->
        <div class="call-ui">
            <header class="chamada-topo">
                <button id="btnPip" class="btn-topo" type="button" title="Minimizar em janela flutuante" aria-label="Minimizar em janela flutuante">
                    <svg class="icone-minimizar" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2.5"></rect><rect x="12" y="11.5" width="7" height="5.5" rx="1" fill="currentColor" stroke="none"></rect></svg>
                    <svg class="icone-restaurar" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                </button>

                <div class="chamada-selo" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                    <span>Chamada direta Sinex</span>
                </div>

                <button id="btnVirarCamera" class="btn-topo u-hidden" type="button" title="Virar câmera" aria-label="Virar câmera">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3.17L15 5H9L7.17 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path><path d="M9.5 13.5a2.5 2.5 0 0 0 4.33 1.7"></path><path d="M14.5 12.5a2.5 2.5 0 0 0-4.33-1.7"></path><polyline points="14.5 10 14.5 12.5 12 12.5"></polyline><polyline points="9.5 16 9.5 13.5 12 13.5"></polyline></svg>
                </button>
            </header>

            <div class="chamada-coluna-central">
                <div class="avatar-container" id="avatarContainer">
                    <div class="avatar-pulse" id="avatarPulse"></div>
                    <img id="fotoContatoChamada" src="assets/avatar-padrao.svg" class="call-avatar avatar" alt="">
                </div>

                <div class="call-info">
                    <div id="nomeContatoChamada" class="call-name">Conectando…</div>
                    <div id="statusChamada" class="call-status" role="status" aria-live="polite">Preparando…</div>
                    <div id="indicadorMudoRemoto" class="indicador-remoto u-hidden">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <span>Microfone desligado</span>
                    </div>
                </div>
            </div>

            <div id="avisoSom" class="chamada-aviso-som u-hidden">
                <button id="btnAtivarSom" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    Toque para ativar o som
                </button>
            </div>

            <div class="call-controls" id="callControls">
                <button id="btnVideo" class="btn-control u-hidden" type="button" title="Desligar câmera" aria-label="Desligar câmera" aria-pressed="false">
                    <svg class="icone-ligado" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                    <svg class="icone-desligado" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>

                <button id="btnMute" class="btn-control" type="button" title="Desativar microfone" aria-label="Desativar microfone" aria-pressed="false">
                    <svg class="icone-ligado" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <svg class="icone-desligado" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>

                <button id="btnEndCall" class="btn-control btn-end-call" type="button" title="Encerrar" aria-label="Encerrar chamada">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                </button>
            </div>
        </div>

        <!-- TELA DE ENCERRAMENTO -->
        <div id="chamadaFim" class="chamada-fim u-hidden" role="status" aria-live="assertive">
            <div class="chamada-fim-icone" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
            </div>
            <strong id="fimTitulo">Chamada encerrada</strong>
            <span id="fimDetalhe"></span>
        </div>
    </div>

    <!-- O som da outra pessoa. Fica FORA da interface de propósito: quando a
         interface vai para o Picture-in-Picture, só ela muda de janela, e o
         áudio nunca é interrompido. -->
    <audio id="audioRemoto" autoplay></audio>

    <!-- Enquanto a interface está no Picture-in-Picture, esta janela mostra isto -->
    <div id="avisoPip" class="chamada-pip-aviso u-hidden">
        <div class="chamada-pip-aviso-caixa">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2.5"></rect><rect x="12" y="11.5" width="7" height="5.5" rx="1" fill="currentColor" stroke="none"></rect></svg>
            <p>A chamada continua na janela flutuante.</p>
            <small>Fechar esta janela encerra a chamada.</small>
            <button id="btnTrazerDeVolta" type="button">Trazer a chamada para cá</button>
        </div>
    </div>

    <script type="module" src="radar.js"></script>
    <script type="module" src="chamada.js"></script>
</body>
</html>
