<!DOCTYPE html> 
<html lang="pt-BR" data-exige-login="sim"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Chamada - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">         
    
    <!-- ESTILOS EXCLUSIVOS DA TELA DE CHAMADA -->
    <style>
        .call-wrapper {
            position: relative;
            width: 100vw;
            height: 100dvh;
            background: var(--bg-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Camadas de Vídeo (WebRTC) */
        .video-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000; /* Fundo sempre preto no vídeo para imersão */
            display: none; /* Escondido por padrão, ativado via JS se for vídeo */
        }
        #videoRemoto {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .local-video-container {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            width: 100px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 5;
            background: #111;
        }
        #videoLocal {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efeito espelho na sua própria câmera */
        }

        /* Interface de Áudio / UI sobreposta */
        .call-ui {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, var(--bg-panel) 0%, transparent 20%, transparent 80%, var(--bg-panel) 100%);
        }

        /* Efeito de Pulso (Sonar) no Avatar */
        .avatar-container {
            position: relative;
            margin-top: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .avatar-pulse {
            position: absolute;
            width: 130px;
            height: 130px;
            background: var(--primary-accent);
            border-radius: 50%;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .call-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        .call-info {
            text-align: center;
            margin-top: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Garante leitura mesmo sobre o vídeo */
        }
        .call-name {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .call-status {
            font-size: 16px;
            color: var(--text-sec);
            font-weight: 500;
        }

        /* Controles da Chamada */
        .call-controls {
            display: flex;
            gap: 25px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .btn-control {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .btn-control:hover { background: rgba(255,255,255,0.25); transform: translateY(-3px); }
        .btn-control:active { transform: scale(0.9); }
        .btn-control.active-muted { background: #fff; color: #111; }
        
        .btn-end-call {
            width: 72px;
            height: 72px;
            background: #ff123c;
            box-shadow: 0 8px 24px rgba(255, 18, 60, 0.4);
        }
        .btn-end-call:hover { background: #e6002b; }

        /* Ajuste específico de cor no tema claro para a UI sobreposta */
        .light-theme .call-ui {
            background: linear-gradient(180deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 20%, rgba(255,255,255,0.4) 80%, rgba(255,255,255,0.9) 100%);
        }
        .light-theme .btn-control { background: rgba(0,0,0,0.1); color: #111; }
        .light-theme .btn-control.active-muted { background: #111; color: #fff; }
        .light-theme .btn-end-call { color: #fff; }
    </style> 
</head> 
<body>     
    <div class="call-wrapper">
        
        <!-- CAMADA DE VÍDEO (Ativada via JS se for chamada de vídeo) -->
        <div id="videoLayer" class="video-layer">
            <video id="videoRemoto" autoplay playsinline></video>
            <div id="localVideoContainer" class="local-video-container">
                <video id="videoLocal" autoplay playsinline muted></video>
            </div>
        </div>

        <!-- CAMADA DA INTERFACE DE USUÁRIO -->
        <div class="call-ui">
            <div style="width: 100%; display: flex; justify-content: flex-start;">
                <!-- Ocultar minimizar por enquanto, volta ao chat encerrando ou programando picture-in-picture no futuro -->
            </div>

            <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="avatar-container" id="avatarContainer">
                    <div class="avatar-pulse" id="avatarPulse"></div>
                    <img id="fotoContatoChamada" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="call-avatar" alt="Avatar">
                </div>
                
                <div class="call-info">
                    <div id="nomeContatoChamada" class="call-name">Conectando...</div>
                    <div id="statusChamada" class="call-status">Chamando...</div>
                </div>
            </div>

            <div class="call-controls">
                <button id="btnMute" class="btn-control" type="button" title="Mutar microfone" aria-label="Desativar microfone" aria-pressed="false">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>

                <button id="btnEndCall" class="btn-control btn-end-call" type="button" title="Encerrar" aria-label="Encerrar chamada">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                </button>

                <button id="btnVideo" class="btn-control" type="button" title="Ligar/desligar câmera" aria-label="Desligar câmera" aria-pressed="false" style="display: none;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                </button>
            </div>
        </div>
    </div>     

<!-- Script Global -->
    <script type="module" src="radar.js"></script>
    
    <!-- Script de lógica pesada de Câmera/Microfone (WebRTC). Deve vir aqui! -->
    <script type="module" src="chamada.js"></script>
</body> 
</html>
