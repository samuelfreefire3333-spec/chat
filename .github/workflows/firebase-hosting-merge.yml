# Publica o site no Firebase Hosting sempre que algo chega na branch main.
# O projeto é estático (sem build): os arquivos vão do jeito que estão.
name: Publicar no Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHAT_PARAMEUAMOR }}
          channelId: live
          projectId: chat-parameuamor
