<!DOCTYPE html>
<html lang="pt-BR" data-exige-login="sim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
    <title>Novo Grupo - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="grupo-novo.css">
</head>
<body>
    <div class="app-layout">

        <!-- NAVEGAÇÃO LATERAL -->
        <nav class="side-nav" aria-label="Navegação principal">
            <a href="inbox.html" class="nav-item nav-logo" title="Sinex Chat" aria-label="Sinex Chat: início"><span class="nav-logo-letra" aria-hidden="true">S</span></a>
            <a href="inbox.html" class="nav-item active" title="Mensagens" aria-label="Mensagens" aria-current="page">
                <span id="badgeGlobal" class="badge u-hidden" aria-hidden="true">0</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>
            </a>
            <a href="explorar.html" class="nav-item" title="Pesquisar" aria-label="Pesquisar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg></a>
            <a href="perfil.html" class="nav-item" title="Perfil" aria-label="Seu perfil"><img id="navAvatar" class="nav-avatar-icon" src="assets/avatar-padrao.svg" alt=""></a>
            <a href="configuracoes.html" class="nav-item nav-item-final" title="Mais" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="5" x2="21" y2="5"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="19" x2="21" y2="19"></line></svg></a>
        </nav>

        <main class="grupo-panel">
            <header class="grupo-header cabecalho-pagina">
                <button class="btn-back" type="button" data-acao="voltar" aria-label="Voltar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1 class="titulo-cabecalho">Novo grupo</h1>
            </header>

            <div class="grupo-conteudo">
                <div class="grupo-nome">
                    <span class="grupo-nome-icone" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </span>
                    <div class="grupo-nome-campo">
                        <label for="inputNomeGrupo" class="sr-only">Nome do grupo</label>
                        <input type="text" id="inputNomeGrupo" class="input-field" placeholder="Nome do grupo" maxlength="60" autocomplete="off" aria-describedby="ajudaGrupo">
                        <span id="contadorNomeGrupo" class="contador-grupo" aria-hidden="true">0/60</span>
                    </div>
                </div>

                <div class="grupo-secao-topo">
                    <h2 class="grupo-secao-titulo">Participantes</h2>
                    <span id="contagemMembros" class="grupo-contagem">0 de 19</span>
                </div>

                <div id="membrosSelecionados" class="membros-selecionados" aria-live="polite"></div>

                <div class="search-box grupo-busca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="inputBuscaGrupo" placeholder="Adicionar pessoas por nome ou @usuário" aria-label="Adicionar pessoas ao grupo" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
                </div>

                <div id="resultadosGrupo" class="resultados-lista" role="group" aria-label="Pessoas para adicionar">
                    <span class="helper-text">Digite para encontrar pessoas para o grupo.</span>
                </div>
            </div>

            <div class="grupo-rodape">
                <span id="ajudaGrupo" class="helper-text">Escolha um nome e pelo menos 2 pessoas (até 20 no total).</span>
                <button id="btnCriarGrupo" class="btn-criar-grupo" type="button" disabled>Criar grupo</button>
            </div>
        </main>
    </div>

    <script type="module" src="radar.js"></script>
    <script type="module" src="grupo-novo.js"></script>
</body>
</html>
