# Quem serve este app é o Netlify (sinexchat.netlify.app), com deploy
# automático a cada commit no main do GitHub.
#
# O firebase.json NÃO vale aqui: os headers dele — incluindo a
# Content-Security-Policy inteira — só são aplicados pelo Firebase Hosting.
# Enquanto este arquivo não existiu, o app esteve no ar sem CSP nenhuma,
# mesmo com o README dizendo que ela era entregue como header HTTP.
#
# Qualquer mudança de header precisa acontecer nos DOIS arquivos.

# ---------------------------------------------------------------------------
# Publicação — só o front-end vai para o ar
# ---------------------------------------------------------------------------
# Antes era publish = ".", e a pasta inteira ia para o ar: código Go, regras
# do Firestore e do Storage, go.mod, README. Foi assim que o firebase-key.json
# vazou.
#
# O comando abaixo é uma lista do que ENTRA, não do que sai. Um arquivo novo
# na raiz só é publicado se for .html, .css ou .js; configuração, segredo,
# testes e código de servidor ficam de fora por padrão, sem ninguém precisar
# lembrar de excluir nada. vendor/ tem só a biblioteca de criptografia (HPKE)
# usada pela proteção de ponta a ponta.
#
# Se uma tela nova precisar de outro tipo de arquivo na raiz, acrescente aqui.
[build]
  command = "rm -rf dist && mkdir dist && cp *.html *.css *.js manifest.json dist/ && cp -r assets vendor dist/"
  publish = "dist"

# ---------------------------------------------------------------------------
# Segurança — mesma política do firebase.json, palavra por palavra
# ---------------------------------------------------------------------------
# CSP:
#   - script-src só aceita os arquivos do próprio site e a versão fixa do SDK
#     do Firebase (caminho /firebasejs/10.12.2/ — antes, qualquer script do
#     www.gstatic.com passava);
#   - sem 'unsafe-inline' e sem 'unsafe-eval' em lugar nenhum;
#   - img-src sem o site de ícones de terceiros (o avatar padrão é local);
#   - connect-src sem ws://localhost (só existia para desenvolvimento);
#   - violações são enviadas ao backend (/seguranca/csp) e aparecem no painel
#     admin, em "Eventos de segurança".
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com/firebasejs/10.12.2/; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.firebasestorage.app https://res.cloudinary.com; media-src 'self' blob: https://firebasestorage.googleapis.com https://*.firebasestorage.app; connect-src 'self' wss://sinex-backend-go.onrender.com https://sinex-backend-go.onrender.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://*.firebasestorage.app https://www.googleapis.com https://api.cloudinary.com https://res.cloudinary.com; worker-src 'self'; manifest-src 'self'; frame-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri https://sinex-backend-go.onrender.com/seguranca/csp; report-to csp"
    Reporting-Endpoints = "csp=\"https://sinex-backend-go.onrender.com/seguranca/csp\""
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
# O Netlify já serve os arquivos comuns com "public, max-age=0,
# must-revalidate", que é exatamente o que se quer com nomes de arquivo sem
# versão — por isso não há regra para js/css aqui.
#
# O Service Worker é o único que precisa ser explícito: é ele que decide
# quando todo o resto é trocado, então nunca pode vir de cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# A biblioteca em vendor/ tem a versão no nome: um arquivo nunca muda de
# conteúdo (versão nova = nome novo).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
