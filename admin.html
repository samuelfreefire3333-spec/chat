<!DOCTYPE html>
<html lang="pt-BR" data-exige-login="sim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
<link rel="stylesheet" href="style.css">
    <script src="tema.js"></script>
<title>Admin - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">
    
    <style>
        .admin-panel { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); overflow-y: auto; position: relative; }
        .admin-header { width: 100%; height: 70px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: var(--bg-main); z-index: 10; padding-top: env(safe-area-inset-top); }
        .btn-back { background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: 15px; }
        .btn-back:active { transform: scale(0.9); }
        .admin-content { width: 100%; max-width: 800px; padding: 30px 20px; margin: 0 auto; animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-panel-2); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.02); position: relative; overflow: hidden; }
        .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary-accent); }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: var(--text-sec); font-weight: 600; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .search-admin { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 20px; transition: 0.2s; }
        .search-admin:focus { border-color: var(--primary-accent); box-shadow: 0 0 0 3px rgba(230,0,43,0.1); }
        .admin-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-user-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel-2); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 12px; transition: 0.2s; }
        .admin-user-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .admin-user-info img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .admin-user-text { display: flex; flex-direction: column; }
        .admin-user-text strong { font-size: 15px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-user-text span { font-size: 12px; color: var(--text-sec); }
        .btn-ban { background: rgba(255, 18, 60, 0.1); color: var(--primary-accent); border: 1px solid rgba(255, 18, 60, 0.3); padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-ban:hover { background: var(--primary-accent); color: white; box-shadow: 0 4px 15px rgba(255,18,60,0.3); }
        .btn-ban:active { transform: scale(0.95); }
        @media (min-width: 850px) { .admin-panel { border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); max-width: 850px; margin: 0 auto; } }
        #toast-aviso { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary-accent); color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 4px 15px rgba(230,0,43,0.4); white-space: nowrap; }
        #toast-aviso.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- NAVEGAÇÃO LATERAL -->
        <nav class="side-nav">
            <a href="inbox.html" class="nav-item" title="Página Inicial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455Z"></path></svg></a>
            <a href="explorar.html" class="nav-item" title="Pesquisa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg></a>
            <a href="inbox.html" class="nav-item" title="Mensagens">
                <div id="badgeGlobal" class="badge" style="display: none;">0</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>
            </a>
            <a href="perfil.html" class="nav-item" title="Perfil"><img id="navAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar"></a>
            
            <a href="configuracoes.html" class="nav-item active" title="Mais" style="margin-top: auto; margin-bottom: 20px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="21" y2="4"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="20" x2="21" y2="20"></line></svg>
            </a>
        </nav>

        <main class="admin-panel" id="mainAdmin" style="display: none;">
            <header class="admin-header">
                <button class="btn-back" type="button" data-acao="voltar" aria-label="Voltar">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <strong style="font-size: 18px; color: var(--text-main);">Centro de Comando</strong>
            </header>
            
            <div class="admin-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div id="totalUsuarios" class="stat-value">...</div>
                        <div class="stat-label">Usuários Cadastrados</div>
                    </div>
                    <div class="stat-card" style="border-left-color: #00a884;">
                        <div id="totalChats" class="stat-value">...</div>
                        <div class="stat-label">Conversas Ativas</div>
                    </div>
                </div>

                <div class="section-title">Gerenciar Usuários</div>
                <input type="text" id="inputBuscaAdmin" class="search-admin" placeholder="Pesquisar usuário para bloquear...">
                
                <div id="listaAdmin" class="admin-list">
                    <p style="text-align: center; color: var(--text-sec); font-size: 14px; margin-top: 20px;">Carregando usuários do sistema...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast-aviso">Alerta!</div>

<script type="module" src="radar.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
