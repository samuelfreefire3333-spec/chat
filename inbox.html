    <!-- ESTILOS EXCLUSIVOS DESTA TELA (O Resto vem do style.css) -->
    <style>         
        /* Inbox Panel */         
        .inbox-panel {             
            width: 405px;             
            flex: 0 0 405px;             
            display: flex;             
            flex-direction: column;             
            background: var(--bg-panel);             
            border-right: 1px solid var(--border-color);             
            position: relative;             
            z-index: 5;         
        }         
        .inbox-header {             
            display: flex;             
            align-items: center;             
            justify-content: space-between;             
            height: 86px;             
            padding: 0 25px;             
            border-bottom: 1px solid var(--border-color);         
        }         
        .inbox-header h1 {             
            font-size: 19px;             
            font-weight: 700;             
            letter-spacing: -.35px;             
            display: flex;             
            align-items: center;             
            gap: 7px;             
            cursor: pointer;         
        }         
        .inbox-header h1 svg {             
            width: 15px;             
            height: 15px;             
            opacity: .7;         
        }         
        .inbox-header-acoes {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .inbox-header .icon-edit {             
            width: 22px;             
            height: 22px;             
            color: var(--text-sec);             
            cursor: pointer;             
            transition: .2s ease;         
        }         
        .inbox-header .icon-edit:hover {             
            color: var(--primary-accent);             
        }         

        /* Lista de Contatos */         
        .messages-title {             
            display: flex;             
            justify-content: space-between;             
            align-items: center;             
            padding: 18px 25px 11px;             
            font-size: 15px;             
            font-weight: 700;             
            letter-spacing: -.1px;         
        }         
        .messages-title .pedidos {             
            color: var(--primary-accent);             
            font-size: 12px;             
            font-weight: 700;             
            cursor: pointer;             
            text-transform: uppercase;             
            letter-spacing: .35px;         
        }         
        .chat-list {             
            flex: 1;             
            overflow-y: auto;             
            padding: 3px 8px 18px;             
            scrollbar-width: thin;             
            scrollbar-color: var(--border-color) transparent;         
        }         
        .chat-list::-webkit-scrollbar { width: 5px; }         
        .chat-list::-webkit-scrollbar-thumb {             
            background: var(--border-color);             
            border-radius: 8px;         
        }         
        .chat-item {             
            min-height: 74px;             
            display: flex;             
            align-items: center;             
            padding: 10px 17px;             
            gap: 13px;             
            margin: 2px 0;             
            border-radius: 14px;             
            cursor: pointer;             
            text-decoration: none;             
            color: inherit;             
            transition: .2s ease;         
        }         
        .chat-item:hover {             
            background: var(--bg-hover);             
            transform: translateX(2px);         
        }         
        .chat-avatar {             
            width: 53px;             
            height: 53px;             
            border-radius: 50%;             
            object-fit: cover;             
            flex-shrink: 0;             
            border: 1px solid var(--border-color);             
        }         
        .chat-info {             
            min-width: 0;             
            flex: 1;             
            display: flex;             
            flex-direction: column;             
            justify-content: center;         
        }         
        .chat-name {             
            font-size: 14px;             
            font-weight: 700;             
            color: var(--text-main);             
            margin-bottom: 5px;         
        }         
        .chat-preview {             
            font-size: 12px;             
            color: var(--text-sec);             
            white-space: nowrap;             
            overflow: hidden;             
            text-overflow: ellipsis;             
            max-width: 240px;         
        }         
        .chat-dot {             
            width: 7px;             
            height: 7px;             
            background: var(--primary-accent);             
            border-radius: 50%;             
            flex-shrink: 0;             
            box-shadow: 0 0 12px rgba(255,18,60,.7);         
        }         

        /* Logo Customizada */
        .logo-letra-s {
            font-size: 56px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -8px;
            line-height: .8;
            color: var(--text-main);
            text-shadow: 0 0 25px rgba(255,18,60,.16);
        }
        .logo-texto-sinex {
            margin-top: 14px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1.3px;
            color: var(--text-main);
        }
        .logo-subtexto {
            margin-top: 9px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 3.4px;
            color: var(--text-sec);
        }

        /* Área central (Placeholder do Chat Vazio) */         
        .chat-placeholder {             
            flex: 1;             
            min-width: 0;             
            display: flex;             
            align-items: center;             
            justify-content: center;             
            position: relative;             
            overflow: hidden;             
            background: var(--bg-panel-2);         
        }         
        .placeholder-content {             
            position: relative;             
            z-index: 2;             
            width: min(560px, calc(100% - 80px));             
            margin-top: 82px;             
            padding: 30px 40px 34px;             
            text-align: center;             
            border: 1px solid var(--border-color);             
            border-radius: 22px;             
            background: var(--bg-main);             
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);         
        }         
        .placeholder-icon {             
            width: 76px;             
            height: 76px;             
            margin: 0 auto 20px;             
            display: flex;             
            align-items: center;             
            justify-content: center;             
            border-radius: 50%;             
            border: 1px solid var(--border-red);             
            background: rgba(230,0,43,.05);             
        }         
        .placeholder-icon svg {             
            width: 34px;             
            height: 34px;             
            color: var(--primary-accent);             
        }         
        .chat-placeholder h2 {             
            font-size: clamp(25px, 2vw, 32px);             
            font-weight: 800;             
            letter-spacing: -.9px;             
            margin-bottom: 10px;         
        }         
        .chat-placeholder p {             
            max-width: 500px;             
            margin: 0 auto 26px;             
            font-size: 13px;             
            line-height: 1.6;             
            color: var(--text-sec);         
        }         
        .btn-enviar-msg {             
            border: 1px solid var(--primary-accent);             
            border-radius: 999px;             
            padding: 12px 28px;             
            background: rgba(230, 0, 43, 0.08);             
            color: var(--primary-accent);             
            font-size: 13px;             
            font-weight: 700;             
            cursor: pointer;             
            transition: .25s ease;             
        }         
        .btn-enviar-msg:hover {             
            background: var(--primary-accent);             
            color: #fff;             
            transform: translateY(-2px);             
        }         

        /* Responsividade Específica do Inbox */         
        @media (max-width: 849px) {             
            .inbox-panel {                 
                order: 1;                 
                width: 100%;                 
                flex: 1;             
            }             
            .chat-placeholder {                 
                display: none;             
            }         
        }         
        @media (min-width: 850px) {             
            .chat-placeholder { display: flex; }         
        }     

        /* MODO CLARO - Degradês Complexos que variáveis não cobrem */
        .light-theme .chat-placeholder {
            background: radial-gradient(ellipse 60% 42% at 64% 51%, rgba(230,0,43,.065), transparent 60%), linear-gradient(135deg, #fbfbfc, #f0f2f5 55%, #fbfbfc);
        }
        .light-theme .placeholder-content { background: rgba(255, 255, 255, 0.85); }
        .light-theme .placeholder-icon { background: radial-gradient(circle, rgba(230,0,43,.08), transparent 66%); }
        .light-theme .logo-letra-s, .light-theme .logo-texto-sinex { color: #111; }
        .light-theme .logo-subtexto { color: #888; }
        .light-theme .btn-enviar-msg { background: rgba(230, 0, 43, 0.08); border-color: var(--primary-accent); color: var(--primary-accent); }
        .light-theme .btn-enviar-msg:hover { background: var(--primary-accent); color: #fff; }
    </style>
