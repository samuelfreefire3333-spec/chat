<!DOCTYPE html> 
<html lang="pt-BR" data-exige-login="sim"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Mensagens - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">          
    
    <!-- ESTILOS EXCLUSIVOS DESTA TELA (O Resto vem do style.css) -->
    <link rel="stylesheet" href="inbox.css">
 
</head> 
<body>     
    <div class="app-layout">                  
        
        <!-- NAVEGAÇÃO LATERAL (Idêntica em todas as telas) -->
        <nav class="side-nav" aria-label="Navegação principal">
            <a href="inbox.html" class="nav-item nav-logo" title="Sinex Chat" aria-label="Sinex Chat: início"><span class="nav-logo-letra" aria-hidden="true">S</span></a>
            <a href="inbox.html" class="nav-item active" title="Mensagens" aria-label="Mensagens" aria-current="page">
                <span id="badgeGlobal" class="badge u-hidden" aria-hidden="true">0</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>
            </a>
            <a href="explorar.html" class="nav-item" title="Pesquisar" aria-label="Pesquisar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg></a>
            <a href="perfil.html" class="nav-item" title="Perfil" aria-label="Seu perfil"><img id="navAvatar" class="nav-avatar-icon" src="assets/avatar-padrao.svg" alt=""></a>
            <a href="configuracoes.html" class="nav-item nav-item-final" title="Mais" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="5" x2="21" y2="5"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="19" x2="21" y2="19"></line></svg></a>
        </nav>         
        
        <aside class="inbox-panel" aria-label="Conversas">
            <header class="inbox-header">
                <h1 id="headerNomeUsuario" class="inbox-titulo"><span data-nome><span class="skeleton skeleton-texto"></span></span></h1>
                <div class="inbox-header-acoes">
                    <a href="grupo-novo.html" class="icon-edit-link" aria-label="Novo grupo" title="Novo grupo">
                        <svg class="icon-edit" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </a>
                    <a href="explorar.html" class="icon-edit-link" aria-label="Nova conversa" title="Nova conversa">
                        <svg class="icon-edit" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </a>
                </div>
            </header>

            <div class="inbox-ferramentas">
                <label class="search-box inbox-busca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" id="buscaConversas" placeholder="Pesquisar conversas" aria-label="Pesquisar conversas" autocomplete="off" autocorrect="off" autocapitalize="none" enterkeyhint="search">
                </label>
                <div class="filtros" id="filtrosConversas" role="toolbar" aria-label="Filtrar conversas">
                    <button type="button" class="filtro-chip ativo" data-filtro="todas" aria-pressed="true">Todas</button>
                    <button type="button" class="filtro-chip" data-filtro="naoLidas" aria-pressed="false">Não lidas <span class="filtro-contagem u-hidden"></span></button>
                    <button type="button" class="filtro-chip" data-filtro="grupos" aria-pressed="false">Grupos</button>
                </div>
            </div>

            <!-- LISTA DE CONVERSAS GERADA PELO INBOX.JS -->
            <div class="chat-list" id="listaConversas" aria-busy="true">
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
                <div class="skeleton-item" aria-hidden="true"><div class="skeleton skeleton-avatar"></div><div class="skeleton-linhas"><div class="skeleton skeleton-linha curta"></div><div class="skeleton skeleton-linha"></div></div></div>
            </div>
        </aside>

        <main class="chat-placeholder">
            <div class="placeholder-content">
                <div class="logo-marca" aria-hidden="true">
                    <span class="logo-letra-s">S</span>
                    <span class="logo-texto-sinex">Sinex <span class="texto-acento">Chat</span></span>
                    <span class="logo-subtexto">CONECTE · CONVERSE · COMPARTILHE</span>
                </div>
                <div class="placeholder-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg>
                </div>
                <h2>Suas mensagens</h2>
                <p>Escolha uma conversa ao lado ou comece uma nova — mande textos, fotos, áudios e ligue por voz ou vídeo.</p>
                <div class="placeholder-acoes">
                    <a href="explorar.html" class="btn-primario btn-pequeno">Nova conversa</a>
                    <a href="grupo-novo.html" class="btn-secundario btn-pequeno">Criar grupo</a>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts Locais Otimizados -->
    <script type="module" src="radar.js"></script>
    <script type="module" src="inbox.js"></script>
</body> 
</html>
