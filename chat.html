<!DOCTYPE html> 
<html lang="pt-BR" data-exige-login="sim"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">          
    
<!-- 👑 CONECTANDO AO SEU CSS MESTRE -->
    <link rel="stylesheet" href="style.css">

    <script src="tema.js"></script>
<title>Chat - Sinex Chat</title>
    <link rel="manifest" href="manifest.json">    
    
    <!-- ESTILOS EXCLUSIVOS DESTA TELA (O Resto vem do style.css) -->
    <link rel="stylesheet" href="chat.css">
 
</head> 
<body>     
    <div class="app-layout">                  
        <nav class="side-nav">             
            <a href="inbox.html" class="nav-item" title="Página Inicial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.005 16.545a2.997 2.997 0 0 1 2.997-2.997A2.997 2.997 0 0 1 15 16.545V22h7V11.543L12 2 2 11.543V22h7v-5.455Z"></path></svg></a>             
            <a href="explorar.html" class="nav-item" title="Pesquisa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5Z"></path><line x1="16.511" y1="16.511" x2="22" y2="22"></line></svg></a>             
            <a href="inbox.html" class="nav-item active" title="Mensagens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.928c0-3.66-3.08-6.66-6.88-6.66H8.88C5.08 5.268 2 8.268 2 11.928c0 3.66 3.08 6.66 6.88 6.66h.273l3.655 3.32a.75.75 0 0 0 1.25-.563v-2.757h1.062c3.8 0 6.88-3 6.88-6.66Z"></path></svg></a>             
            <a href="perfil.html" class="nav-item" title="Perfil"><img id="navAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="nav-avatar-icon"></a>                          
            <a href="configuracoes.html" class="nav-item nav-item-final nav-item-elevado" title="Mais">                 
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="4" x2="21" y2="4"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="20" x2="21" y2="20"></line></svg>             
            </a>         
        </nav>         
        
        <main class="chat-panel">                          
            <header class="chat-header">                 
                <div class="header-left-group">                     
                    <button class="icon-btn btn-voltar-recuo" data-acao="voltar" type="button" aria-label="Voltar">                         
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>                     
                    </button>                                          
                    <div class="header-user-info" data-acao="abrir-perfil" role="button" tabindex="0">                         
                        <img id="fotoContato" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto">                         
                        <div class="names">                             
                            <div id="nomeContato">Carregando...</div>                             
                            <div id="statusContato">Buscando status...</div>                         
                        </div>                     
                    </div>                 
                </div>                                  
                
                <div class="header-actions-group">                     
                    <button class="icon-btn" data-acao="chamada-audio" type="button" title="Chamada de voz" aria-label="Chamada de voz">                         
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">                             
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>                         
                        </svg>                     
                    </button>                                          
                    <button class="icon-btn" data-acao="chamada-video" type="button" title="Chamada de vídeo" aria-label="Chamada de vídeo">                         
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">                             
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>                             
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>                         
                        </svg>                     
                    </button>                 
                </div>             
            </header>             
            
            <div id="mensagens">                 
                <div id="indicador-digitando" class="msg-wrapper-other u-hidden">                     
                    <img id="fotoDigitando" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">                     
                    <div class="msg-bubble msg-other typing-dots"><span></span><span></span><span></span></div>                 
                </div>             
            </div>             
            
            <div class="chat-input-area">                 
                <div id="respostaPreview" class="reply-preview">
                    <div class="reply-preview-linha"></div>
                    <div class="reply-preview-texto">
                        <strong id="respostaPreviewAutor"></strong>
                        <span id="respostaPreviewTexto"></span>
                    </div>
                    <button id="btnCancelarResposta" type="button" class="reply-preview-fechar" aria-label="Cancelar resposta">×</button>
                </div>

                <div class="input-pill">                     
                    <input type="text" id="texto" placeholder="Mensagem..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">                                          
                    <div id="action-buttons" class="action-icons-group">                         
                        <button class="input-icon-btn" data-acao="audio" type="button" title="Gravar áudio" aria-label="Gravar áudio">                             
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>                         
                        </button>                         
                        <button class="input-icon-btn" data-acao="galeria" type="button" title="Enviar imagem" aria-label="Enviar imagem">                             
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>                         
                        </button>                     
                    </div>                     
                    <button id="btnEnviar" class="btn-enviar-azul" type="button" title="Enviar" aria-label="Enviar mensagem">                         
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>                     
                    </button>                 
                </div>             
            </div>         
        </main>     
    </div>     
    <div id="toast-aviso">Alerta!</div>     
    
<!-- Scripts Locais Otimizados -->
    <script type="module" src="radar.js"></script>
    <script type="module" src="chat.js"></script>

</body> 
</html>
