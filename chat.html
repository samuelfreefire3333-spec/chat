<title>Chat - Sinex Chat</title>

    <!-- ESTILOS EXCLUSIVOS DESTA TELA (O Resto vem do style.css) -->
    <style>         
        .chat-panel { flex: 1; display: flex; flex-direction: column; width: 100%; order: 1; background-color: var(--bg-main); position: relative; overflow: hidden; }         
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background-color: var(--bg-main); border-bottom: 1px solid var(--border-color); height: 65px; flex-shrink: 0; padding-top: calc(8px + env(safe-area-inset-top)); }         
        .header-left-group { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }                  
        
        .header-user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 4px; overflow: hidden; border-radius: 8px; transition: background 0.2s; }         
        .header-user-info:active { background-color: var(--bg-hover); }         
        .header-user-info img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border-color); }         
        .header-user-info .names { overflow: hidden; }         
        .header-user-info .names div:first-child { font-weight: 600; font-size: 15px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }         
        .header-user-info .names div:last-child { font-size: 12px; color: var(--text-sec); }         
        
        .header-actions-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }         
        .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-main); cursor: pointer; border-radius: 50%; font-size: 18px; transition: 0.2s; }         
        .icon-btn:active { transform: scale(0.9); background-color: var(--bg-hover); }         
        
        #mensagens { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; background-color: var(--bg-main); -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }                  
        
        /* Ajustes de mídia dentro da bolha */
        .msg-bubble img, .msg-bubble video { max-width: 100%; border-radius: 12px; margin-top: 4px; margin-bottom: 4px; display: block; }         
        .msg-bubble audio { max-width: 100%; height: 40px; margin-top: 4px; outline: none; }         
        
        /* Efeito "Digitando..." */
        .typing-dots { display: flex; align-items: center; gap: 4px; padding: 14px 16px; height: 16px; width: fit-content; }         
        .typing-dots span { width: 6px; height: 6px; background-color: var(--text-sec); border-radius: 50%; display: inline-block; animation: typing-bounce 1.4s infinite ease-in-out both; }         
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }         
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }         
        @keyframes typing-bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }         
        
        /* Barra de Envio */
        .chat-input-area { padding: 8px 16px; background-color: var(--bg-main); flex-shrink: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }         

        /* Barra de "respondendo a" — some por padrão, o chat.js mostra com display:flex */
        .reply-preview {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
            background: var(--bg-panel-2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }
        .reply-preview-linha { width: 3px; align-self: stretch; background: var(--primary-accent); border-radius: 2px; flex-shrink: 0; }
        .reply-preview-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .reply-preview-texto strong { font-size: 12.5px; color: var(--primary-accent); }
        .reply-preview-texto span { font-size: 13px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .reply-preview-fechar { background: none; border: none; color: var(--text-sec); font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1; }
        .reply-preview-fechar:hover { color: var(--text-main); }

        .input-pill { display: flex; align-items: center; background-color: #262626; border-radius: 24px; padding: 4px 6px 4px 16px; min-height: 48px; width: 100%; transition: 0.2s; }         
        .input-pill input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 15px; outline: none; padding: 0; height: 40px; min-width: 0; }         
        .input-pill input::placeholder { color: var(--text-sec); }         
        .action-icons-group { display: flex; align-items: center; gap: 4px; }         
        .input-icon-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; transition: 0.2s; }         
        .input-icon-btn:active { opacity: 0.5; }         
        .btn-enviar-azul { width: 36px; height: 36px; background-color: var(--primary-accent); border: none; border-radius: 50%; display: none; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }         
        .btn-enviar-azul:active { transform: scale(0.9); }         
        .btn-enviar-azul svg { margin-right: 2px; margin-top: 2px; }         
        
        #toast-aviso { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--primary-accent); color: white; padding: 10px 20px; border-radius: 30px; font-size: 14px; font-weight: bold; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 4px 15px rgba(230, 0, 43, 0.4); white-space: nowrap; }         
        #toast-aviso.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }         
        
        @media (min-width: 850px) {             
            .chat-panel { max-width: 800px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); order: 2; margin: 0 auto; }         
        }

        /* Ajuste do input para o Modo Claro */
        .light-theme .input-pill { background-color: var(--input-bg); border: 1px solid var(--border-color); }
    </style> 
</head>

        <main class="chat-panel">                          
            <header class="chat-header">                 
                <div class="header-left-group">                     
                    <button class="icon-btn" data-acao="voltar" type="button" aria-label="Voltar" style="margin-left: -8px;">                         
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>                     
                    </button>                                          
                    <div class="header-user-info" data-acao="abrir-perfil" role="button" tabindex="0">                         
                        <img id="fotoContato" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto">                         
                        <div class="names">                             
                            <div id="nomeContato">Carregando...</div>                             
                            <div id="statusContato">Buscando status...</div>                         
                        </div>                     
                    </div>                 
                </div>                                  
                
                <div class="header-actions-group">                     
                    <button class="icon-btn" data-acao="chamada-audio" type="button" title="Chamada de voz" aria-label="Chamada de voz">                         
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">                             
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>                         
                        </svg>                     
                    </button>                                          
                    <button class="icon-btn" data-acao="chamada-video" type="button" title="Chamada de vídeo" aria-label="Chamada de vídeo">                         
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">                             
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>                             
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>                         
                        </svg>                     
                    </button>                 
                </div>             
            </header>             
            
            <div id="mensagens">                 
                <div id="indicador-digitando" class="msg-wrapper-other" style="display: none;">                     
                    <img id="fotoDigitando" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Avatar">                     
                    <div class="msg-bubble msg-other typing-dots"><span></span><span></span><span></span></div>                 
                </div>             
            </div>             
            
            <div class="chat-input-area">                 
                <div id="respostaPreview" class="reply-preview">
                    <div class="reply-preview-linha"></div>
                    <div class="reply-preview-texto">
                        <strong id="respostaPreviewAutor"></strong>
                        <span id="respostaPreviewTexto"></span>
                    </div>
                    <button id="btnCancelarResposta" type="button" class="reply-preview-fechar" aria-label="Cancelar resposta">×</button>
                </div>

                <div class="input-pill">                     
                    <input type="text" id="texto" placeholder="Mensagem..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">                                          
                    <div id="action-buttons" class="action-icons-group">                         
                        <button class="input-icon-btn" data-acao="audio" type="button" title="Gravar áudio" aria-label="Gravar áudio">                             
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>                         
                        </button>                         
                        <button class="input-icon-btn" data-acao="galeria" type="button" title="Enviar imagem" aria-label="Enviar imagem">                             
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>                         
                        </button>                     
                    </div>                     
                    <button id="btnEnviar" class="btn-enviar-azul" type="button" title="Enviar" aria-label="Enviar mensagem">                         
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>                     
                    </button>                 
                </div>             
            </div>         
        </main>
